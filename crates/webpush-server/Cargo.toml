[package]
name = "webpush-server"
description = "A reference implementation of an IETF Web Push service (RFC 8030, RFC 8291, RFC 8292)"
keywords = ["webpush", "push", "rfc8030", "vapid", "websocket"]
categories = ["network-programming", "web-programming::http-server"]
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
webpush-apns = { workspace = true, optional = true }
webpush-bridge.workspace = true
webpush-crypto.workspace = true
webpush-fcm = { workspace = true, optional = true }
webpush-store.workspace = true

axum.workspace = true
base64.workspace = true
bytes.workspace = true
figment = { version = "0.10", features = ["toml", "env"] }
http.workspace = true
httpdate = "1"
humantime-serde = "1"
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1.20", features = ["tokio", "service", "server-auto", "http1", "http2"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
p256.workspace = true
reqwest.workspace = true
ring.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["cors"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
aes-gcm.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "http2"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "crypto"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }

[features]
default = ["fcm", "apns"]
# Firebase Cloud Messaging bridge.
fcm = ["dep:webpush-fcm"]
# Apple Push Notification service bridge.
apns = ["dep:webpush-apns"]
# Cloud Bigtable storage.
bigtable = ["webpush-store/bigtable"]

[lints]
workspace = true
