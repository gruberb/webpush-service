[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
repository = "https://github.com/gruberb/webpush-service"

[workspace.dependencies]
webpush-apns = { path = "crates/webpush-apns", version = "0.2.0" }
webpush-bridge = { path = "crates/webpush-bridge", version = "0.2.0" }
webpush-crypto = { path = "crates/webpush-crypto", version = "0.2.0" }
webpush-fcm = { path = "crates/webpush-fcm", version = "0.2.0" }
webpush-store = { path = "crates/webpush-store", version = "0.2.0" }

aes-gcm = "0.10"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
bytes = "1"
hkdf = "0.12"
http = "1"
p256 = { version = "0.13", features = ["ecdh", "ecdsa"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "json", "form"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal"] }
tracing = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
print_stdout = "warn"
print_stderr = "warn"
