[package]
name = "webpush-service"
version = "0.1.0"
edition = "2024"
description = "A reference implementation of an IETF Web Push service (RFC 8030, RFC 8291, RFC 8292, RFC 8188)"
repository = "https://github.com/gruberb/webpush-service"
readme = "README.md"
keywords = ["webpush", "push", "rfc8030", "vapid", "websocket"]
categories = ["network-programming", "web-programming::http-server", "cryptography"]

[dependencies]
aes-gcm = "0.10"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
bytes = "1"
googleapis-tonic-google-bigtable-admin-v2 = { version = "0.45", optional = true }
googleapis-tonic-google-bigtable-v2 = { version = "0.39", optional = true }
hkdf = "0.12"
http = "1"
http-body-util = "0.1"
httpdate = "1"
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1.20", features = ["tokio", "service", "server-auto", "http1", "http2"] }
p256 = { version = "0.13", features = ["ecdh", "ecdsa"] }
prost-types = { version = "0.14", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-stream = "0.1"
tonic = { version = "0.14", features = ["transport"], optional = true }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
hyper = { version = "1", features = ["client", "http1", "http2"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "crypto"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }

[features]
default = []
# Cloud Bigtable storage adapter (`store::BigtableStore`).
bigtable = [
    "dep:tonic",
    "dep:prost-types",
    "dep:googleapis-tonic-google-bigtable-v2",
    "dep:googleapis-tonic-google-bigtable-admin-v2",
]
